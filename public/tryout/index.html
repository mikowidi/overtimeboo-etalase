<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Tryout Mini SKD CPNS</title>
<meta name="description" content="Tryout mini SKD CPNS 30 soal, 27 menit, format CAT. Skor per subtes, pembahasan tiap nomor, dan saran materi yang perlu dilatih.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: lembar CAT. Pita navy di atas (timer + progres), kartu soal di kiri,
   kisi nomor soal di kanan; di HP kisi turun ke bawah kartu soal.
   Token mengikuti etalase overtimeboo v3.7 (navy, dua tema). */
:root {
  --bg: #ECF0F6;
  --surface: #FFFFFF;
  --surface-2: #F4F7FB;
  --band: #0E2A55;
  --on-band: #FFFFFF;
  --on-band-muted: #B9C6DC;
  --heading: #0A1D3A;
  --text: #33415C;
  --muted: #56637A;
  --line: #D3DCE8;
  --line-strong: #B9C6DC;
  --primary: #0E2A55;
  --primary-hover: #173A6B;
  --on-primary: #FFFFFF;
  --go: #0F7A4A;
  --go-hover: #0B6E3F;
  --on-go: #FFFFFF;
  --accent: #C0392B;
  --ok: #0F7A4A;
  --ok-bg: #E3F3EA;
  --bad: #B42318;
  --bad-bg: #FBE9E7;
  --doubt: #8A5A00;
  --doubt-bg: #FFF1D6;
  --doubt-line: #E0A33A;
  --sel-bg: #E6EEF9;
  --sel-line: #0E2A55;
  --figure-bg: #FFFFFF;
  --focus: #1F5FBF;
  --shadow: 0 1px 2px rgba(10, 29, 58, .06), 0 6px 20px rgba(10, 29, 58, .06);

  --font-display: "DM Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --step--1: .8125rem;
  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: 1.375rem;
  --step-3: 1.875rem;
  --step-4: 2.5rem;
  --radius: 14px;
  --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071A36; --surface: #0E2A55; --surface-2: #173A6B; --band: #05132A;
    --on-band: #FFFFFF; --on-band-muted: #B9C6DC;
    --heading: #FFFFFF; --text: #C9D4E6; --muted: #9AA7BD;
    --line: rgba(255, 255, 255, .14); --line-strong: rgba(255, 255, 255, .26);
    --primary: #6FB3FF; --primary-hover: #8AC2FF; --on-primary: #0A1D3A;
    --go: #3FD68B; --go-hover: #5FE0A0; --on-go: #0A1D3A; --accent: #FF7A6B;
    --ok: #3FD68B; --ok-bg: rgba(63, 214, 139, .14);
    --bad: #FF8A7A; --bad-bg: rgba(255, 122, 107, .14);
    --doubt: #F5B94A; --doubt-bg: rgba(245, 185, 74, .16); --doubt-line: #F5B94A;
    --sel-bg: rgba(111, 179, 255, .16); --sel-line: #6FB3FF;
    --figure-bg: #FFFFFF; --focus: #8AC2FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071A36; --surface: #0E2A55; --surface-2: #173A6B; --band: #05132A;
  --on-band: #FFFFFF; --on-band-muted: #B9C6DC;
  --heading: #FFFFFF; --text: #C9D4E6; --muted: #9AA7BD;
  --line: rgba(255, 255, 255, .14); --line-strong: rgba(255, 255, 255, .26);
  --primary: #6FB3FF; --primary-hover: #8AC2FF; --on-primary: #0A1D3A;
  --go: #3FD68B; --go-hover: #5FE0A0; --on-go: #0A1D3A; --accent: #FF7A6B;
  --ok: #3FD68B; --ok-bg: rgba(63, 214, 139, .14);
  --bad: #FF8A7A; --bad-bg: rgba(255, 122, 107, .14);
  --doubt: #F5B94A; --doubt-bg: rgba(245, 185, 74, .16); --doubt-line: #F5B94A;
  --sel-bg: rgba(111, 179, 255, .16); --sel-line: #6FB3FF;
  --figure-bg: #FFFFFF; --focus: #8AC2FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band);
}
h1, h2, h3 { font-family: var(--font-display); color: var(--heading); line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* pita atas */
.band {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--band); color: var(--on-band);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band-inner {
  max-width: 1080px; margin: 0 auto; min-height: 60px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em; font-size: var(--step-1); }
.brand span { color: var(--on-band-muted); font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band-stats { display: flex; align-items: center; gap: 10px; }
.timer {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: var(--step-1);
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 999px; padding: 4px 14px;
}
.timer.low { background: #C0392B; border-color: #C0392B; }
.timer small { font-family: var(--font-body); font-weight: 500; font-size: var(--step--1); color: var(--on-band-muted); }
.timer.low small { color: #FFFFFF; }
.answered { font-size: var(--step--1); color: var(--on-band-muted); }
.answered b { color: var(--on-band); }

.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.eyebrow { font-size: var(--step--1); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--heading);
  font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-go { background: var(--go); border-color: var(--go); color: var(--on-go); }
.btn-go:hover { background: var(--go-hover); border-color: var(--go-hover); }
.btn-ghost { background: transparent; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn[aria-disabled="true"] { border-style: dashed; color: var(--muted); background: transparent; cursor: default; }
.btn-band { background: transparent; color: var(--on-band); border-color: rgba(255, 255, 255, .4); min-height: 40px; padding: 6px 14px; }
.btn-band:hover { border-color: #FFFFFF; }

/* intro */
.intro { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.intro-main { padding: 28px; display: grid; gap: 18px; }
.intro-main h1 { font-size: var(--step-4); font-weight: 800; letter-spacing: -.02em; }
.lede { font-size: var(--step-1); color: var(--text); max-width: 60ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 12px; font-size: var(--step--1); font-weight: 600; color: var(--heading); background: var(--surface-2); }
.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fineprint { font-size: var(--step--1); color: var(--muted); }
.scoring { padding: 22px; display: grid; gap: 14px; }
.scoring table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
.scoring th, .scoring td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scoring th { font-size: var(--step--1); color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.scoring td:first-child { font-weight: 700; color: var(--heading); white-space: nowrap; }
.scoring tr:last-child td { border-bottom: 0; }

/* ujian */
.exam { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.qcard { padding: 22px; display: grid; gap: 16px; min-width: 0; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qno { font-family: var(--font-display); font-weight: 800; font-size: var(--step-2); color: var(--heading); }
.qno small { font-family: var(--font-body); font-weight: 500; font-size: var(--step--1); color: var(--muted); margin-left: 6px; }
.tag { font-size: var(--step--1); font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--heading); border: 1px solid var(--line); }
.stem { font-size: var(--step-1); color: var(--heading); white-space: pre-line; }
.figure { background: var(--figure-bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; }
.figure img { display: block; width: 100%; height: auto; max-width: 100%; margin: 0 auto; }
@media (max-width: 600px) { .figure img { max-width: 360px; } }
.options { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; }
.opt { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--primary); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .letter { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9375rem; border: 1.5px solid var(--line-strong); color: var(--heading); }
.opt .otext { min-width: 0; padding-top: 2px; }
.opt.is-on { background: var(--sel-bg); border-color: var(--sel-line); }
.opt.is-on .letter { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.qactions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.qactions .grow { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-doubt.is-on { background: var(--doubt-bg); border-color: var(--doubt-line); color: var(--doubt); }

.navcard { padding: 18px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.navgroup { display: grid; gap: 8px; }
.navgroup h3 { font-size: var(--step--1); font-family: var(--font-body); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.grid10 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.nb { min-height: 40px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--heading); font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.nb.ans { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.nb.doubt { background: var(--doubt-bg); border-color: var(--doubt-line); color: var(--doubt); }
.nb.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: var(--step--1); color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line-strong); background: var(--surface); }
.legend i.ans { background: var(--primary); border-color: var(--primary); }
.legend i.doubt { background: var(--doubt-bg); border-color: var(--doubt-line); }

/* konfirmasi */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(5, 19, 42, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
.dialog { max-width: 440px; width: 100%; padding: 22px; display: grid; gap: 14px; }
.dialog h2 { font-size: var(--step-2); }
.dialog .cta-row { justify-content: flex-end; }

/* hasil */
.result { display: grid; gap: 20px; }
.score-hero { padding: 26px; display: grid; gap: 18px; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); align-items: center; }
.total { display: grid; gap: 2px; }
.total .big { font-family: var(--font-display); font-weight: 800; font-size: 3.5rem; line-height: 1; color: var(--heading); letter-spacing: -.02em; }
.total .big span { font-size: var(--step-2); color: var(--muted); font-weight: 700; }
.bars { display: grid; gap: 16px; min-width: 0; }
.bar-row { display: grid; gap: 6px; }
.bar-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.bar-top b { color: var(--heading); font-family: var(--font-display); font-size: var(--step-1); }
.bar { position: relative; height: 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--primary); }
.bar .mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--accent); }
.bar-note { font-size: var(--step--1); color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--step--1); font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.mid { background: var(--doubt-bg); color: var(--doubt); }
.section { padding: 22px; display: grid; gap: 14px; }
.section h2 { font-size: var(--step-2); }
.focus-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.focus-item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; display: grid; gap: 6px; background: var(--surface-2); }
.focus-item h3 { font-size: var(--step-0); font-family: var(--font-body); font-weight: 700; }
.focus-item .meta { font-size: var(--step--1); color: var(--muted); }
.product { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: center; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 14px; }
.product p { min-width: 0; max-width: 60ch; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; font-size: var(--step--1); color: var(--heading); }
.filters button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.review { display: grid; gap: 10px; }
.ritem { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
.ritem summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ritem summary::-webkit-details-marker { display: none; }
.ritem summary .lhs { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.ritem summary .lhs b { font-variant-numeric: tabular-nums; color: var(--heading); }
.ritem summary .lhs span { color: var(--muted); font-size: var(--step--1); }
.rbody { padding: 0 14px 14px; display: grid; gap: 10px; }
.rbody .stem { font-size: var(--step-0); }
.ropts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.ropts li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: .9375rem; }
.ropts li .l { font-weight: 700; color: var(--heading); width: 1.2em; flex: 0 0 auto; }
.ropts li .t { min-width: 0; flex: 1; }
.ropts li .s { font-size: var(--step--1); font-weight: 700; color: var(--muted); white-space: nowrap; }
.ropts li.key { border-color: var(--ok); background: var(--ok-bg); }
.ropts li.mine-bad { border-color: var(--bad); background: var(--bad-bg); }
.ropts li.mine { box-shadow: inset 3px 0 0 var(--primary); }
.explain { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: .9375rem; }
.explain .ref { display: block; margin-top: 6px; font-size: var(--step--1); color: var(--muted); }
.foot { margin-top: 28px; display: grid; gap: 6px; font-size: var(--step--1); color: var(--muted); }

@media (max-width: 900px) {
  .intro, .exam, .score-hero { grid-template-columns: minmax(0, 1fr); }
  .navcard { position: static; }
  .intro-main h1 { font-size: var(--step-3); }
}
@media (max-width: 520px) {
  .intro-main, .qcard, .section, .score-hero { padding: 18px; }
  .brand span { display: none; }
  .qactions .btn { flex: 1 1 auto; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .nb, .btn { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
}
</style>
</head>
<body>


<div class="band" id="band">
  <div class="band-inner">
    <div class="brand"><b>overtimeboo</b><span>Tryout Mini SKD CPNS</span></div>
    <div class="band-stats" id="bandStats" hidden>
      <span class="answered num" id="answered" aria-live="polite"></span>
      <span class="timer num" id="timer" role="timer" aria-label="Sisa waktu"><small>sisa</small><span id="timerText">27:00</span></span>
      <button class="btn btn-band" type="button" id="btnFinishTop">Selesai</button>
    </div>
  </div>
</div>

<main class="wrap" id="app"></main>

<div class="overlay" id="confirm" hidden>
  <div class="dialog card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">Kumpulkan jawaban sekarang?</h2>
    <p id="confirmText"></p>
    <div class="cta-row">
      <button class="btn" type="button" id="btnCancel">Kembali ke soal</button>
      <button class="btn btn-primary" type="button" id="btnSubmit">Kumpulkan</button>
    </div>
  </div>
</div>

<script>
var DATA = {"paket":"SKD-PREVIEW-01","versi":"1.0","tanggal":"2026-11-16","acuan_format":"SKD CAT BKN: TWK 30, TIU 35, TKP 45 butir, 100 menit (format sama dipakai SKD Sekolah Kedinasan 2026, KepmenPANRB 406/2026)","acuan_ambang":"KepmenPANRB 321/2024 (CPNS umum, acuan terakhir; ambang CPNS 2026 belum terbit per 16 Nov 2026)","ambang_penuh":{"TWK":65,"TIU":80,"TKP":166},"jumlah_penuh":{"TWK":30,"TIU":35,"TKP":45},"durasi_menit":27,"catatan":"Pool preview terpisah dari Tryout Paket 1-3. Boleh disebar gratis.","struktur":{"TWK":{"jumlah":10,"skor_benar":5,"skor_salah":0},"TIU":{"jumlah":10,"skor_benar":5,"skor_salah":0},"TKP":{"jumlah":10,"skor":"1-5 per opsi"}},"twk":[{"id":"PV-TWK-01","subtopik":"nasionalisme","tipe":"kasus","tingkat_kesulitan":"mudah","soal":"Menjelang upacara peringatan hari kemerdekaan, petugas kantor mendapati Bendera Negara di tiang depan kantor sudah luntur warnanya dan robek di bagian ujung, sementara bendera pengganti belum tersedia. Tindakan yang paling tepat adalah ...","opsi":{"A":"Tetap mengibarkannya karena yang penting bendera berkibar saat upacara","B":"Menjahit bagian yang robek lalu mengibarkannya kembali","C":"Menurunkan bendera itu dan segera mengupayakan bendera pengganti yang layak","D":"Mengibarkannya setengah tiang agar kerusakannya tidak terlalu terlihat","E":"Menggantinya dengan umbul-umbul merah putih yang tersedia di gudang"},"kunci":"C","pembahasan":"Jawaban C. UU 24/2009 Pasal 24 huruf c melarang setiap orang mengibarkan Bendera Negara yang rusak, robek, luntur, kusut, atau kusam. Menjahit bagian yang robek tidak memulihkan warna yang luntur, posisi setengah tiang adalah tanda berkabung (bukan cara menutupi kerusakan), dan umbul-umbul tidak bisa menggantikan Bendera Negara di tiang upacara.","referensi":"UU 24/2009 tentang Bendera, Bahasa, dan Lambang Negara, serta Lagu Kebangsaan, Pasal 24 huruf c"},{"id":"PV-TWK-02","subtopik":"nasionalisme","tipe":"kasus","tingkat_kesulitan":"mudah","soal":"Saat lagu kebangsaan Indonesia Raya diperdengarkan pada pembukaan seminar di aula kantor, seorang peserta tetap duduk sambil merekam video dengan ponselnya. Menurut ketentuan perundang-undangan, sikap yang seharusnya dilakukan setiap orang yang hadir adalah ...","opsi":{"A":"Berdiri tegak dengan sikap hormat sampai lagu selesai","B":"Meletakkan tangan kanan di dada kiri selama lagu berlangsung","C":"Tetap duduk dengan tenang asalkan tidak berbicara atau bermain ponsel","D":"Ikut bernyanyi sambil mengangkat tangan kanan setinggi bahu","E":"Menundukkan kepala sebagai tanda penghormatan kepada para pahlawan"},"kunci":"A","pembahasan":"Jawaban A. Pasal 62 UU 24/2009 menyatakan setiap orang yang hadir saat Lagu Kebangsaan diperdengarkan dan/atau dinyanyikan wajib berdiri tegak dengan sikap hormat. Meletakkan tangan di dada, mengangkat tangan, menunduk, atau tetap duduk bukan sikap yang diatur undang-undang ini.","referensi":"UU 24/2009 Pasal 62"},{"id":"PV-TWK-03","subtopik":"integritas","tipe":"kasus","tingkat_kesulitan":"mudah","soal":"Anda mendapati tunjangan kinerja bulan ini masuk dua kali ke rekening Anda karena kesalahan sistem pembayaran. Belum ada pihak yang menyadarinya. Tindakan yang paling tepat adalah ...","opsi":{"A":"Membiarkannya sampai bagian keuangan menagih kelebihan itu sendiri","B":"Memakainya dulu untuk keperluan mendesak, lalu mengembalikannya hanya bila nanti diminta","C":"Menganggapnya rezeki karena kesalahan tidak berasal dari Anda","D":"Menanyakan kepada rekan lain apakah mereka juga menerimanya, lalu memutuskan bersama","E":"Melaporkannya ke bagian keuangan dan mengembalikan kelebihan itu sesuai prosedur"},"kunci":"E","pembahasan":"Jawaban E. Kelebihan pembayaran adalah uang negara yang bukan hak Anda. Nilai dasar akuntabel menuntut Anda melapor dan mengembalikannya tanpa menunggu ditagih. Menunda atau memakainya lebih dulu tetap berarti menguasai uang yang bukan hak, dan keputusan bersama rekan tidak menghapus kewajiban itu.","referensi":"UU 20/2023 tentang ASN Pasal 4 (nilai dasar akuntabel); UU 17/2003 tentang Keuangan Negara Pasal 3 ayat (1)"},{"id":"PV-TWK-04","subtopik":"integritas","tipe":"konsep","tingkat_kesulitan":"sedang","soal":"Laporan Harta Kekayaan Penyelenggara Negara (LHKPN) wajib disampaikan kepada ...","opsi":{"A":"Badan Pemeriksa Keuangan Republik Indonesia","B":"Komisi Pemberantasan Korupsi","C":"Inspektorat Jenderal di kementerian masing-masing","D":"Badan Kepegawaian Negara","E":"Ombudsman Republik Indonesia (ORI)"},"kunci":"B","pembahasan":"Jawaban B. Kewajiban penyelenggara negara melaporkan dan mengumumkan kekayaannya diatur UU 28/1999 Pasal 5, sedangkan pendaftaran dan pemeriksaan LHKPN menjadi tugas KPK. BPK memeriksa pengelolaan keuangan negara, bukan kekayaan pribadi pejabat, dan Ombudsman mengawasi pelayanan publik.","referensi":"UU 28/1999 Pasal 5; UU 30/2002 jo. UU 19/2019 tentang KPK"},{"id":"PV-TWK-05","subtopik":"bela_negara","tipe":"konsep","tingkat_kesulitan":"sedang","soal":"Menurut UU Nomor 3 Tahun 2002 tentang Pertahanan Negara, unsur utama sistem pertahanan dalam menghadapi ancaman nonmiliter, seperti wabah penyakit menular atau krisis ekonomi, adalah ...","opsi":{"A":"Tentara Nasional Indonesia yang didukung oleh komponen cadangan dan komponen pendukung","B":"Komponen cadangan yang telah dimobilisasi","C":"Kepolisian Negara Republik Indonesia","D":"Lembaga pemerintah di luar bidang pertahanan sesuai bentuk dan sifat ancamannya","E":"Rakyat sebagai kekuatan pendukung"},"kunci":"D","pembahasan":"Jawaban D. Pasal 7 ayat (3) UU 3/2002: dalam menghadapi ancaman nonmiliter, lembaga pemerintah di luar bidang pertahanan menjadi unsur utama sesuai bentuk dan sifat ancaman, didukung unsur lain kekuatan bangsa. TNI menjadi komponen utama untuk ancaman militer (Pasal 7 ayat (2)). Contohnya, wabah penyakit ditangani lembaga kesehatan sebagai unsur utama.","referensi":"UU 3/2002 tentang Pertahanan Negara Pasal 7 ayat (2) dan (3)"},{"id":"PV-TWK-06","subtopik":"bela_negara","tipe":"kasus","tingkat_kesulitan":"sedang","soal":"Seorang mahasiswa diajak bergabung dengan kelompok yang ingin memisahkan provinsinya dari NKRI dengan alasan pembangunan di daerahnya tertinggal. Sikap yang paling mencerminkan bela negara adalah ...","opsi":{"A":"Menolak ajakan itu dan menyalurkan aspirasi ketertinggalan daerah lewat jalur konstitusional","B":"Bergabung karena ketertinggalan pembangunan di daerahnya memang nyata dan sudah lama dirasakan warga","C":"Menolak ajakan itu dan memilih tidak lagi membicarakan persoalan ketertinggalan daerahnya di mana pun","D":"Bergabung secara diam-diam untuk mengetahui rencana kelompok tersebut","E":"Mendukung kelompok itu di media sosial tanpa ikut kegiatannya"},"kunci":"A","pembahasan":"Jawaban A. Bela negara berarti setia pada Pancasila dan keutuhan NKRI tanpa menutup mata terhadap masalah nyata. Ketertinggalan daerah adalah aspirasi yang sah dan disalurkan lewat DPRD, DPD, musyawarah perencanaan pembangunan, atau jalur hukum, bukan lewat pemisahan wilayah. Menolak sambil berhenti peduli pada daerahnya kehilangan sisi pengabdian.","referensi":"UUD NRI 1945 Pasal 27 ayat (3) dan Pasal 37 ayat (5); UU 23/2019 tentang PSDN (nilai dasar bela negara)"},{"id":"PV-TWK-07","subtopik":"pilar_negara","tipe":"konsep","tingkat_kesulitan":"mudah","soal":"Setelah perubahan UUD 1945, Presiden dan Wakil Presiden Republik Indonesia dipilih dengan cara ...","opsi":{"A":"Dipilih oleh MPR dengan suara terbanyak","B":"Dipilih oleh DPR atas usul partai politik pemenang pemilu","C":"Dipilih dalam satu pasangan secara langsung oleh rakyat","D":"Dipilih langsung oleh rakyat secara terpisah antara presiden dan wakil presiden","E":"Diangkat oleh MPR berdasarkan hasil pemilihan umum legislatif"},"kunci":"C","pembahasan":"Jawaban C. Pasal 6A ayat (1) UUD 1945 hasil perubahan ketiga (2001): Presiden dan Wakil Presiden dipilih dalam satu pasangan secara langsung oleh rakyat. Sebelum perubahan, keduanya dipilih MPR. Pemilihan presiden dan wakil presiden secara terpisah tidak dikenal dalam sistem Indonesia.","referensi":"UUD NRI 1945 Pasal 6A ayat (1)"},{"id":"PV-TWK-08","subtopik":"pilar_negara","tipe":"kasus","tingkat_kesulitan":"mudah","soal":"Setelah terjadi bentrokan antarsuporter dua kota dalam sebuah pertandingan sepak bola, para pemuda dari kedua kota menggelar nonton bareng dan bakti sosial bersama dengan semboyan \"beda klub, satu Indonesia\". Kegiatan tersebut terutama mencerminkan pengamalan Pancasila sila ...","opsi":{"A":"kedua","B":"pertama","C":"keempat","D":"kelima","E":"ketiga"},"kunci":"E","pembahasan":"Jawaban E. Mengutamakan persatuan di atas fanatisme kelompok dan memulihkan kerukunan setelah konflik adalah inti sila ketiga, Persatuan Indonesia. Bakti sosialnya memang bernuansa kemanusiaan, tetapi tujuan utama kegiatan itu menyatukan kembali dua kelompok yang berseteru.","referensi":"Butir-butir pengamalan Pancasila sila ke-3"},{"id":"PV-TWK-09","subtopik":"pilar_negara","tipe":"kasus","tingkat_kesulitan":"sulit","soal":"Seseorang mengunggah alamat rumah dan nomor telepon orang lain ke media sosial dengan dalih kebebasan berpendapat. Ketentuan UUD 1945 yang menegaskan bahwa pelaksanaan hak dan kebebasan setiap orang dapat dibatasi dengan undang-undang untuk menghormati hak dan kebebasan orang lain adalah ...","opsi":{"A":"Pasal 28E ayat (3)","B":"Pasal 28F","C":"Pasal 28I ayat (1)","D":"Pasal 28J ayat (2)","E":"Pasal 28D ayat (1)"},"kunci":"D","pembahasan":"Jawaban D. Pasal 28J ayat (2): dalam menjalankan hak dan kebebasannya, setiap orang wajib tunduk pada pembatasan yang ditetapkan dengan undang-undang, antara lain untuk menjamin pengakuan serta penghormatan atas hak dan kebebasan orang lain. Pasal 28E ayat (3) justru menjamin kebebasan mengeluarkan pendapat, Pasal 28F menjamin hak berkomunikasi dan memperoleh informasi, dan Pasal 28I ayat (1) memuat hak yang tidak dapat dikurangi dalam keadaan apa pun.","referensi":"UUD NRI 1945 Pasal 28J ayat (2); UU 27/2022 tentang Pelindungan Data Pribadi"},{"id":"PV-TWK-10","subtopik":"bahasa_indonesia","tipe":"konsep","tingkat_kesulitan":"sedang","soal":"Penulisan gabungan kata yang sesuai kaidah ejaan terdapat pada kalimat ...","opsi":{"A":"Hasil rapat itu harus segera diberi tahukan kepada seluruh pegawai.","B":"Panitia telah menyerahkan laporan pertanggungjawaban kegiatan.","C":"Setiap pegawai wajib bertanggungjawab atas tugasnya.","D":"Anggaran pelatihan itu akan di lipatgandakan tahun depan.","E":"Kepala bagian sudah menanda tangani surat undangan itu."},"kunci":"B","pembahasan":"Jawaban B. Gabungan kata yang mendapat awalan dan akhiran sekaligus ditulis serangkai: pertanggungjawaban, diberitahukan, dilipatgandakan, menandatangani. Jika hanya mendapat awalan atau akhiran saja, unsur gabungan katanya tetap ditulis terpisah: bertanggung jawab.","referensi":"EYD Edisi V, penulisan gabungan kata berimbuhan"}],"tiu":[{"id":"PV-TIU-01","kategori":"verbal","subtopik":"analogi","tingkat_kesulitan":"mudah","soal":"PETA : ATLAS = LAGU : ...","gambar":null,"opsi":{"A":"Penyanyi","B":"Album","C":"Lirik","D":"Nada","E":"Konser"},"kunci":"B","pembahasan":"Jawaban B. Relasinya satuan dan kumpulannya: atlas adalah kumpulan peta, album adalah kumpulan lagu. Lirik dan nada adalah bagian dari sebuah lagu, bukan kumpulannya, sedangkan penyanyi adalah orang yang membawakannya."},{"id":"PV-TIU-02","kategori":"verbal","subtopik":"silogisme","tingkat_kesulitan":"sedang","soal":"Semua dokumen yang telah disetujui sudah dibubuhi paraf kepala bagian. Sebagian dokumen di meja Sari belum dibubuhi paraf kepala bagian. Kesimpulan yang tepat adalah ...","gambar":null,"opsi":{"A":"Semua dokumen di meja Sari belum disetujui","B":"Semua dokumen yang berparaf kepala bagian sudah disetujui","C":"Sebagian dokumen yang disetujui berada di meja Sari","D":"Tidak dapat ditarik kesimpulan","E":"Sebagian dokumen di meja Sari belum disetujui"},"kunci":"E","pembahasan":"Jawaban E. Setiap dokumen yang disetujui pasti berparaf. Dokumen di meja Sari yang belum berparaf berarti pasti belum disetujui, sehingga sebagian dokumen di meja Sari belum disetujui. Kesimpulan \"semua\" terlalu luas, dan pernyataan bahwa semua dokumen berparaf sudah disetujui membalik premis pertama."},{"id":"PV-TIU-03","kategori":"verbal","subtopik":"analitis","tingkat_kesulitan":"sedang","soal":"Empat pegawai, yaitu Arif, Bima, Citra, dan Dina, masing-masing bertugas di bagian yang berbeda: keuangan, umum, TI, dan hukum. Bima bertugas di bagian hukum. Arif tidak bertugas di bagian keuangan maupun TI. Citra tidak bertugas di bagian TI. Pegawai yang bertugas di bagian keuangan adalah ...","gambar":null,"opsi":{"A":"Arif","B":"Bima","C":"Citra","D":"Dina","E":"Tidak dapat ditentukan"},"kunci":"C","pembahasan":"Jawaban C. Bima sudah pasti di bagian hukum. Arif tidak di keuangan, tidak di TI, dan tidak di hukum, sehingga Arif di bagian umum. Tersisa keuangan dan TI untuk Citra dan Dina. Karena Citra tidak di TI, Citra bertugas di keuangan dan Dina di TI."},{"id":"PV-TIU-04","kategori":"verbal","subtopik":"analitis","tingkat_kesulitan":"sedang","soal":"Rapat dimulai pukul 09.00. Bayu datang 5 menit setelah rapat dimulai. Andi datang 10 menit sebelum Bayu. Cahya datang 15 menit lebih awal daripada Andi. Dedi datang tepat saat rapat dimulai. Urutan kedatangan dari yang paling awal adalah ...","gambar":null,"opsi":{"A":"Cahya, Andi, Dedi, Bayu","B":"Andi, Cahya, Dedi, Bayu","C":"Cahya, Dedi, Andi, Bayu","D":"Dedi, Cahya, Andi, Bayu","E":"Cahya, Andi, Bayu, Dedi"},"kunci":"A","pembahasan":"Jawaban A. Hitung jam kedatangan masing-masing: Bayu 09.05, Andi 09.05 dikurangi 10 menit = 08.55, Cahya 08.55 dikurangi 15 menit = 08.40, dan Dedi 09.00. Urutannya Cahya, Andi, Dedi, lalu Bayu."},{"id":"PV-TIU-05","kategori":"numerik","subtopik":"berhitung","tingkat_kesulitan":"mudah","soal":"Hasil dari 1,25 × 64 − 12,5% × 160 adalah ...","gambar":null,"opsi":{"A":"40","B":"55","C":"60","D":"65","E":"70"},"kunci":"C","pembahasan":"Jawaban C. 1,25 = 5/4, sehingga 1,25 × 64 = 80. 12,5% = 1/8, sehingga 12,5% × 160 = 20. Hasilnya 80 − 20 = 60."},{"id":"PV-TIU-06","kategori":"numerik","subtopik":"deret","tingkat_kesulitan":"sedang","soal":"2, 5, 12, 27, 58, ... Bilangan berikutnya adalah ...","gambar":null,"opsi":{"A":"116","B":"117","C":"119","D":"121","E":"124"},"kunci":"D","pembahasan":"Jawaban D. Setiap suku dikali 2 lalu ditambah bilangan yang terus naik: 2×2+1 = 5, 5×2+2 = 12, 12×2+3 = 27, 27×2+4 = 58. Suku berikutnya 58×2+5 = 121. Cara lain: selisih antarsukunya 3, 7, 15, 31 (tiap selisih dikali 2 lalu ditambah 1), jadi selisih berikutnya 63 dan 58 + 63 = 121."},{"id":"PV-TIU-07","kategori":"numerik","subtopik":"perbandingan_kuantitatif","tingkat_kesulitan":"sedang","soal":"x = banyaknya bilangan prima di antara 10 dan 30, sedangkan y = banyaknya kelipatan 4 di antara 10 dan 30. Hubungan x dan y adalah ...","gambar":null,"opsi":{"A":"x lebih besar dari y","B":"x lebih kecil dari y","C":"x sama dengan y","D":"x sama dengan dua kali y","E":"Hubungan x dan y tidak dapat ditentukan"},"kunci":"A","pembahasan":"Jawaban A. Bilangan prima di antara 10 dan 30 adalah 11, 13, 17, 19, 23, dan 29, jadi x = 6. Kelipatan 4 di antara 10 dan 30 adalah 12, 16, 20, 24, dan 28, jadi y = 5. Maka x lebih besar dari y."},{"id":"PV-TIU-08","kategori":"numerik","subtopik":"soal_cerita","tingkat_kesulitan":"sedang","soal":"Harga 3 buku tulis dan 2 pena adalah Rp27.000, sedangkan harga 2 buku tulis dan 3 pena adalah Rp23.000. Harga 1 buku tulis dan 1 pena adalah ...","gambar":null,"opsi":{"A":"Rp9.000","B":"Rp10.000","C":"Rp11.000","D":"Rp12.000","E":"Rp12.500"},"kunci":"B","pembahasan":"Jawaban B. Jumlahkan kedua persamaan: 5 buku + 5 pena = Rp50.000, sehingga 1 buku + 1 pena = Rp10.000. Harga masing-masing tidak perlu dicari (buku Rp7.000, pena Rp3.000)."},{"id":"PV-TIU-09","kategori":"figural","subtopik":"figural_analogi","tingkat_kesulitan":"sedang","soal":"Perhatikan gambar. Pasangan pertama menunjukkan hubungan tertentu. Tentukan gambar yang tepat untuk melengkapi pasangan kedua.","gambar":"pv-tiu-09.png","opsi":{"A":"Gambar A","B":"Gambar B","C":"Gambar C","D":"Gambar D","E":"Gambar E"},"kunci":"D","pembahasan":"Jawaban D. Pada pasangan pertama, bangun luar dan bangun dalam bertukar tempat: persegi besar berisi lingkaran kecil menjadi lingkaran besar berisi persegi kecil. Maka segitiga besar berisi lingkaran kecil menjadi lingkaran besar berisi segitiga kecil, yaitu gambar D.","gambar_md5":"db48d069b42aef32c2f790a5ceaca958","gambar_hp":"pv-tiu-09-hp.png","gambar_hp_md5":"b97d6d219f89fc09fe98caa70af15e08"},{"id":"PV-TIU-10","kategori":"figural","subtopik":"figural_serial","tingkat_kesulitan":"sulit","soal":"Perhatikan rangkaian gambar berikut. Tentukan gambar yang tepat untuk melanjutkan pola.","gambar":"pv-tiu-10.png","opsi":{"A":"Gambar A","B":"Gambar B","C":"Gambar C","D":"Gambar D","E":"Gambar E"},"kunci":"E","pembahasan":"Jawaban E. Ada dua gerakan sekaligus. Titik hitam berpindah satu sudut searah jarum jam (kiri atas, kanan atas, kanan bawah, kiri bawah), sedangkan lingkaran putih berpindah satu sudut berlawanan arah jarum jam (kiri bawah, kanan bawah, kanan atas, kiri atas). Langkah berikutnya titik kembali ke kiri atas dan lingkaran kembali ke kiri bawah, yaitu gambar E.","gambar_md5":"986afcb44893d323541ef17790db39d6","gambar_hp":"pv-tiu-10-hp.png","gambar_hp_md5":"5f4545d99bebc3a1cd7c2228e8ae9b55"}],"tkp":[{"id":"PV-TKP-01","subtopik":"pelayanan_publik","tingkat_kesulitan":"mudah","soal":"Seorang warga datang ke loket Anda untuk mengurus layanan yang ternyata menjadi kewenangan instansi lain. Ia sudah menempuh perjalanan cukup jauh. Sikap Anda ...","opsi":{"A":"Menyampaikan bahwa layanan itu bukan kewenangan kantor Anda","B":"Menyarankan warga mencari sendiri informasinya di internet","C":"Memberikan alamat instansi yang berwenang","D":"Menjelaskan instansi yang berwenang beserta persyaratan yang perlu dibawa","E":"Menjelaskan instansi yang berwenang dan persyaratannya, lalu memastikan informasinya lewat kanal resmi instansi itu"},"skor_opsi":{"A":2,"B":1,"C":3,"D":4,"E":5},"pembahasan":"Opsi E terbaik: warga tidak cukup diberi tahu bahwa layanannya bukan di sini, tetapi diarahkan sampai jelas instansi dan persyaratannya, dan informasinya dipastikan lewat kanal resmi sehingga perjalanan berikutnya tidak sia-sia. Opsi B terburuk karena menyuruh warga mencari sendiri sama dengan melepas tanggung jawab melayani."},{"id":"PV-TKP-02","subtopik":"pelayanan_publik","tingkat_kesulitan":"sedang","soal":"Anda menyadari ada satu huruf yang salah pada nama warga di dokumen yang Anda terbitkan beberapa hari lalu. Warga tersebut belum menyadarinya. Sikap Anda ...","opsi":{"A":"Menghubungi warga, menjelaskan kesalahannya, dan menerbitkan dokumen perbaikan tanpa biaya","B":"Membiarkannya karena kesalahan satu huruf tidak mengubah makna dokumen","C":"Melaporkan kesalahan itu kepada atasan dan menunggu arahan berikutnya","D":"Menunggu warga menyadarinya sendiri lalu datang meminta perbaikan","E":"Menyiapkan dokumen perbaikan dan baru memberikannya ketika warga datang kembali ke kantor untuk urusan lain"},"skor_opsi":{"A":5,"B":1,"C":3,"D":2,"E":4},"pembahasan":"Opsi A terbaik: kesalahan petugas diperbaiki atas inisiatif petugas, tanpa membebani warga. Nama yang salah bisa menyulitkan warga saat dokumen itu dipakai untuk urusan lain. Opsi B terburuk karena menganggap kesalahan kecil tidak penting berarti mengabaikan dampaknya bagi warga."},{"id":"PV-TKP-03","subtopik":"jejaring_kerja","tingkat_kesulitan":"sedang","soal":"Anda ditugaskan menggabungkan data program dari tiga instansi mitra. Ternyata setiap instansi memakai format data yang berbeda sehingga penggabungan memakan waktu lama. Sikap Anda ...","opsi":{"A":"Mengolah sendiri seluruh data ke format unit Anda setiap kali data dari ketiga instansi itu masuk ke meja Anda","B":"Meminta ketiga instansi menyesuaikan diri dengan format unit Anda","C":"Mengusulkan rapat teknis dengan ketiga instansi untuk menyepakati format data bersama","D":"Menunda penggabungan sampai ketiga instansi menyeragamkan formatnya sendiri","E":"Menyusun templat format data dan mengirimkannya ke ketiga instansi beserta petunjuk pengisiannya"},"skor_opsi":{"A":3,"B":2,"C":5,"D":1,"E":4},"pembahasan":"Opsi C terbaik: masalah diselesaikan di sumbernya lewat kesepakatan bersama, sehingga semua instansi ikut memiliki format yang dipakai. Templat yang dikirim sepihak sudah solutif, tetapi kurang melibatkan mitra. Opsi D terburuk karena menunggu tanpa inisiatif membuat program tertahan."},{"id":"PV-TKP-04","subtopik":"jejaring_kerja","tingkat_kesulitan":"mudah","soal":"Proyek kolaborasi lintas unit yang Anda koordinasikan baru saja selesai dengan hasil baik. Sikap Anda ...","opsi":{"A":"Mengirim ucapan terima kasih kepada setiap unit mitra melalui pesan singkat pribadi","B":"Mengajak semua unit mengevaluasi proyek dan mencatat pembelajarannya","C":"Menghubungi unit mitra lagi hanya ketika ada proyek berikutnya yang membutuhkan keterlibatan mereka","D":"Menyusun laporan akhir atas nama unit Anda saja karena Anda yang mengoordinasikan proyek","E":"Mengusulkan apresiasi resmi bagi tim lintas unit kepada pimpinan"},"skor_opsi":{"A":3,"B":5,"C":2,"D":1,"E":4},"pembahasan":"Opsi B terbaik: jejaring dirawat setelah proyek selesai lewat evaluasi dan dokumentasi bersama, sehingga kolaborasi berikutnya lebih mudah. Opsi D terburuk karena mengklaim hasil kerja bersama atas nama satu unit merusak kepercayaan mitra."},{"id":"PV-TKP-05","subtopik":"sosial_budaya","tingkat_kesulitan":"sedang","soal":"Dalam musyawarah warga di wilayah tugas Anda, sebagian besar peserta berbicara dalam bahasa daerah, padahal ada beberapa peserta pendatang yang tidak memahaminya. Sikap Anda ...","opsi":{"A":"Meminta pemimpin musyawarah beralih menggunakan bahasa Indonesia sejak pembukaan sampai akhir acara","B":"Menegur warga yang memakai bahasa daerah karena musyawarah ini merupakan forum resmi yang wajib berbahasa Indonesia","C":"Menerjemahkan secara pribadi untuk peserta pendatang yang duduk di dekat Anda","D":"Mengusulkan bahasa Indonesia sebagai pengantar tanpa melarang bahasa daerah","E":"Membiarkan musyawarah tetap berjalan dalam bahasa daerah karena sebagian besar peserta memahaminya"},"skor_opsi":{"A":4,"B":1,"C":3,"D":5,"E":2},"pembahasan":"Opsi D terbaik: semua peserta bisa ikut bermusyawarah lewat bahasa persatuan, tanpa merendahkan bahasa daerah yang menjadi identitas warga. Opsi B terburuk karena menegur pemakaian bahasa daerah menyinggung budaya setempat dan merusak suasana musyawarah."},{"id":"PV-TKP-06","subtopik":"sosial_budaya","tingkat_kesulitan":"mudah","soal":"Penyuluhan yang Anda jadwalkan pukul 09.00 di sebuah desa selalu sepi peserta. Ternyata sebagian besar warga desa itu petani yang sudah berada di sawah sejak pagi. Sikap Anda ...","opsi":{"A":"Tetap menjalankan penyuluhan sesuai jadwal karena sudah ditetapkan","B":"Menyesuaikan waktu dan tempat penyuluhan dengan kebiasaan warga setelah bertanya kepada tokoh setempat","C":"Membagikan materi penyuluhan dalam bentuk brosur ke rumah warga","D":"Memindahkan penyuluhan ke sore hari tanpa mengonfirmasi kepada warga","E":"Melaporkan kepada atasan bahwa warga desa itu kurang antusias terhadap program"},"skor_opsi":{"A":2,"B":5,"C":3,"D":4,"E":1},"pembahasan":"Opsi B terbaik: program menyesuaikan diri dengan ritme hidup masyarakat, dan perubahannya disepakati lewat tokoh setempat. Memindahkan jadwal tanpa bertanya sudah adaptif, tetapi bisa meleset lagi. Opsi E terburuk karena menyalahkan warga mengabaikan akar masalahnya, yaitu jadwal yang tidak sesuai kebiasaan warga."},{"id":"PV-TKP-07","subtopik":"tik","tingkat_kesulitan":"sedang","soal":"Anda diminta mengunggah daftar penerima bantuan ke situs instansi agar penyalurannya transparan. Daftar itu memuat nama, NIK, dan alamat lengkap penerima. Sikap Anda ...","opsi":{"A":"Meminta arahan PPID atau bagian hukum sebelum mengunggahnya","B":"Mengunggah nama penerima saja tanpa NIK dan alamat, dan tidak berkonsultasi dengan siapa pun lebih dulu","C":"Mengunggah daftar itu apa adanya karena keterbukaan informasi wajib dijalankan","D":"Menolak mengunggah daftar tersebut karena memuat data pribadi","E":"Mengunggahnya dengan NIK dan alamat disamarkan sesuai ketentuan pelindungan data pribadi"},"skor_opsi":{"A":4,"B":3,"C":1,"D":2,"E":5},"pembahasan":"Opsi E terbaik: transparansi tetap berjalan tanpa membuka data pribadi secara utuh. NIK dan alamat lengkap termasuk data pribadi yang dilindungi UU 27/2022 tentang Pelindungan Data Pribadi. Opsi C terburuk karena membuka data apa adanya berisiko disalahgunakan, misalnya untuk pinjaman daring ilegal atau penipuan."},{"id":"PV-TKP-08","subtopik":"profesionalisme","tingkat_kesulitan":"sedang","soal":"Saat bertugas ke luar kota, Anda baru menyadari berkas bahan paparan tertinggal di kantor, padahal rapat dimulai satu jam lagi. Sikap Anda ...","opsi":{"A":"Membatalkan kehadiran karena tidak membawa bahan","B":"Menyampaikan paparan secara lisan sebisanya tanpa bahan","C":"Meminta kiriman berkas digital lewat kanal resmi sambil menyiapkan poin utama paparan","D":"Meminta rekan di kantor segera mengirimkan berkas digitalnya lewat pesan pribadi agar bisa langsung dipakai","E":"Meminta penyelenggara menunda rapat sampai berkas aslinya diantarkan dari kantor"},"skor_opsi":{"A":1,"B":3,"C":5,"D":4,"E":2},"pembahasan":"Opsi C terbaik: masalah diatasi cepat lewat jalur yang aman, sambil menyiapkan rencana cadangan agar paparan tetap berjalan. Opsi A terburuk karena membatalkan kehadiran merugikan forum yang sudah dijadwalkan."},{"id":"PV-TKP-09","subtopik":"profesionalisme","tingkat_kesulitan":"mudah","soal":"Atasan memberi masukan bahwa laporan Anda terlalu panjang sehingga pimpinan sulit menangkap intinya. Sikap Anda ...","opsi":{"A":"Meminta contoh format yang diharapkan, lalu menyusun ulang dengan ringkasan di awal","B":"Menjelaskan kepada atasan bahwa seluruh isi laporan itu penting dan memang perlu diketahui oleh pimpinan","C":"Meringkas laporan dengan menghapus bagian-bagian yang menurut penilaian Anda sendiri kurang penting","D":"Meminta rekan yang lebih pandai menulis untuk menyusun laporan berikutnya atas nama Anda","E":"Memperbaiki laporan tersebut sesuai masukan atasan"},"skor_opsi":{"A":5,"B":2,"C":3,"D":1,"E":4},"pembahasan":"Opsi A terbaik: masukan diterima, ekspektasi diperjelas, dan perbaikannya berlaku untuk laporan-laporan berikutnya. Memperbaiki laporan itu saja sudah baik, tetapi belum menyentuh kebiasaan menulisnya. Opsi D terburuk karena menyuruh orang lain menulis laporan atas nama Anda berarti menghindari pengembangan diri dan tidak jujur atas hasil kerja."},{"id":"PV-TKP-10","subtopik":"anti_radikalisme","tingkat_kesulitan":"sedang","soal":"Anda mengelola akun media sosial resmi instansi. Di kolom komentar muncul ajakan melakukan kekerasan terhadap kelompok tertentu. Sikap Anda ...","opsi":{"A":"Membalas komentar itu dengan kecaman keras agar pelakunya jera","B":"Membiarkannya karena setiap warganet berhak menyampaikan pendapat di kolom komentar akun publik","C":"Melaporkannya kepada pimpinan dan menunggu arahan sebelum bertindak","D":"Menyembunyikan komentar, menyimpan bukti, dan melaporkannya","E":"Menghapus komentar itu secepatnya tanpa menyimpan bukti apa pun"},"skor_opsi":{"A":2,"B":1,"C":4,"D":5,"E":3},"pembahasan":"Opsi D terbaik: penyebaran ajakan kekerasan dihentikan cepat, dan buktinya tetap tersimpan untuk ditindaklanjuti pihak berwenang. Menghapus tanpa menyimpan bukti memutus penelusuran. Opsi B terburuk karena ajakan kekerasan bukan bagian dari kebebasan berpendapat."}]};

        "</div>" +
        "<div class='card section'><h2>Yang perlu kamu latih dulu</h2>" +
          "<p class='fineprint'>Diurutkan dari persentase terendah. Satu subtopik di tryout mini cuma berisi 1 sampai 3 soal, jadi anggap ini arah belajar, bukan vonis.</p>" +
          "<div class='focus-list'>" + fokusHtml + "</div>" +
          "<div class='product'><p><b>" + esc(prod.nama) + "</b><br>" + esc(prod.isi) + "</p>" + prodBtn + "</div>" +
        "</div>" +
        "<div class='card section'><h2>Pembahasan tiap nomor</h2>" +
          "<div class='filters' role='group' aria-label='Saring pembahasan'>" +
            fbtn("semua", "Semua (" + N + ")") + fbtn("salah", "Salah atau kosong") + fbtn("tkp", "TKP di bawah skor 5") +
          "</div><div class='review' id='review'></div>" +
          "<div class='cta-row'><button class='btn' type='button' id='btnAgain'>Ulangi dari awal</button></div>" +
        "</div>" +
      "</section>" + footer();
    renderReview();
    Array.prototype.forEach.call(app.querySelectorAll(".filters button"), function (b) {
      b.onclick = function () { filter = b.getAttribute("data-f"); renderResultFilters(); renderReview(); };
    });
    document.getElementById("btnAgain").onclick = function () { clearSaved(); state = fresh(); filter = "semua"; renderIntro(null); window.scrollTo({ top: 0 }); };
  }
  function fbtn(f, text) { return "<button type='button' data-f='" + f + "' aria-pressed='" + (filter === f) + "'>" + esc(text) + "</button>"; }
  function renderResultFilters() {
    Array.prototype.forEach.call(app.querySelectorAll(".filters button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-f") === filter)); });
  }
  function pilihFokus(sub) {
    var arr = Object.keys(sub).map(function (k) { return { k: k, r: sub[k].skor / sub[k].maks }; });
    arr.sort(function (a, b) { return a.r - b.r; });
    return arr.filter(function (x) { return x.r < 0.8; }).slice(0, 3).map(function (x) { return x.k; });
  }
  function renderReview() {
    var box = document.getElementById("review");
    var html = Q.map(function (q, i) {
      var a = state.answers[q.id];
      var v = nilai(q, a);
      if (filter === "salah" && (q.subtes === "TKP" || v === 5)) return "";
      if (filter === "tkp" && (q.subtes !== "TKP" || v === 5)) return "";
      var status;
      if (q.subtes === "TKP") status = a ? "<span class='chip " + (v === 5 ? "ok" : (v >= 3 ? "mid" : "bad")) + " num'>Skor " + v + "</span>" : "<span class='chip bad'>Kosong</span>";
      else status = a ? (v === 5 ? "<span class='chip ok'>Benar</span>" : "<span class='chip bad'>Salah</span>") : "<span class='chip bad'>Kosong</span>";
      var best = q.subtes === "TKP" ? bestLetter(q) : q.kunci;
      var opts = LETTERS.map(function (L) {
        var cls = [];
        if (L === best) cls.push("key");
        if (L === a) cls.push(L === best ? "mine" : "mine-bad mine");
        var right = q.subtes === "TKP" ? "<span class='s num'>skor " + q.skor_opsi[L] + "</span>" : (L === q.kunci ? "<span class='s'>kunci</span>" : "");
        if (L === a) right = "<span class='s'>jawabanmu</span>" + (q.subtes === "TKP" ? " <span class='s num'>· skor " + q.skor_opsi[L] + "</span>" : "");
        return "<li class='" + cls.join(" ") + "'><span class='l'>" + L + "</span><span class='t'>" + esc(q.opsi[L]) + "</span>" + right + "</li>";
      }).join("");
      var fig = figure(q, "Gambar soal figural nomor " + (i + 1));
      var ref = q.referensi ? "<span class='ref'>Rujukan: " + esc(q.referensi) + "</span>" : "";
      return "<details class='ritem'><summary><span class='lhs'><b>" + (i + 1) + "</b><span>" + q.subtes + " · " + esc(label(q.subtopik)) + "</span></span>" + status + "</summary>" +
        "<div class='rbody'><p class='stem'>" + esc(q.soal) + "</p>" + fig + "<ul class='ropts'>" + opts + "</ul>" +
        "<p class='explain'>" + esc(q.pembahasan) + ref + "</p></div></details>";
    }).join("");
    box.innerHTML = html || "<p class='fineprint'>Tidak ada soal di saringan ini. Mantap.</p>";
  }

  // ---------- boot ----------
  var saved = load();
  if (saved && saved.phase === "test") {
    if (Date.now() >= saved.endsAt) { state = saved; finish(true); }
    else renderIntro(saved);
  } else if (saved && saved.phase === "result") {
    state = saved; renderResult();
  } else {
    renderIntro(null);
  }
})();
</script>

</body>
</html>
