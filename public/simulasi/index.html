<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="robots" content="noindex">
<title>Simulasi SKD CPNS</title>
<meta name="description" content="Simulasi CAT SKD CPNS khusus pembeli Tryout Paket 1 sampai 3: 110 soal, 100 menit, skor langsung keluar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: lembar CAT. Pita navy di atas (timer + progres), kartu soal di kiri,
   kisi nomor soal di kanan; di HP kisi turun ke bawah kartu soal.
   Token mengikuti etalase overtimeboo v3.7 (navy, dua tema). */
:root {
  --bg: #ECF0F6;
  --surface: #FFFFFF;
  --surface-2: #F4F7FB;
  --band: #0E2A55;
  --on-band: #FFFFFF;
  --on-band-muted: #B9C6DC;
  --heading: #0A1D3A;
  --text: #33415C;
  --muted: #56637A;
  --line: #D3DCE8;
  --line-strong: #B9C6DC;
  --primary: #0E2A55;
  --primary-hover: #173A6B;
  --on-primary: #FFFFFF;
  --go: #0F7A4A;
  --go-hover: #0B6E3F;
  --on-go: #FFFFFF;
  --accent: #C0392B;
  --ok: #0F7A4A;
  --ok-bg: #E3F3EA;
  --bad: #B42318;
  --bad-bg: #FBE9E7;
  --doubt: #8A5A00;
  --doubt-bg: #FFF1D6;
  --doubt-line: #E0A33A;
  --sel-bg: #E6EEF9;
  --sel-line: #0E2A55;
  --figure-bg: #FFFFFF;
  --focus: #1F5FBF;
  --shadow: 0 1px 2px rgba(10, 29, 58, .06), 0 6px 20px rgba(10, 29, 58, .06);

  --font-display: "DM Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --step--1: .8125rem;
  --step-0: 1rem;
  --step-1: 1.125rem;
  --step-2: 1.375rem;
  --step-3: 1.875rem;
  --step-4: 2.5rem;
  --radius: 14px;
  --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071A36; --surface: #0E2A55; --surface-2: #173A6B; --band: #05132A;
    --on-band: #FFFFFF; --on-band-muted: #B9C6DC;
    --heading: #FFFFFF; --text: #C9D4E6; --muted: #9AA7BD;
    --line: rgba(255, 255, 255, .14); --line-strong: rgba(255, 255, 255, .26);
    --primary: #6FB3FF; --primary-hover: #8AC2FF; --on-primary: #0A1D3A;
    --go: #3FD68B; --go-hover: #5FE0A0; --on-go: #0A1D3A; --accent: #FF7A6B;
    --ok: #3FD68B; --ok-bg: rgba(63, 214, 139, .14);
    --bad: #FF8A7A; --bad-bg: rgba(255, 122, 107, .14);
    --doubt: #F5B94A; --doubt-bg: rgba(245, 185, 74, .16); --doubt-line: #F5B94A;
    --sel-bg: rgba(111, 179, 255, .16); --sel-line: #6FB3FF;
    --figure-bg: #FFFFFF; --focus: #8AC2FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071A36; --surface: #0E2A55; --surface-2: #173A6B; --band: #05132A;
  --on-band: #FFFFFF; --on-band-muted: #B9C6DC;
  --heading: #FFFFFF; --text: #C9D4E6; --muted: #9AA7BD;
  --line: rgba(255, 255, 255, .14); --line-strong: rgba(255, 255, 255, .26);
  --primary: #6FB3FF; --primary-hover: #8AC2FF; --on-primary: #0A1D3A;
  --go: #3FD68B; --go-hover: #5FE0A0; --on-go: #0A1D3A; --accent: #FF7A6B;
  --ok: #3FD68B; --ok-bg: rgba(63, 214, 139, .14);
  --bad: #FF8A7A; --bad-bg: rgba(255, 122, 107, .14);
  --doubt: #F5B94A; --doubt-bg: rgba(245, 185, 74, .16); --doubt-line: #F5B94A;
  --sel-bg: rgba(111, 179, 255, .16); --sel-line: #6FB3FF;
  --figure-bg: #FFFFFF; --focus: #8AC2FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band);
}
h1, h2, h3 { font-family: var(--font-display); color: var(--heading); line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* pita atas */
.band {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--band); color: var(--on-band);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band-inner {
  max-width: 1080px; margin: 0 auto; min-height: 60px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em; font-size: var(--step-1); }
.brand span { color: var(--on-band-muted); font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band-stats { display: flex; align-items: center; gap: 10px; }
.timer {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-display); font-weight: 700; font-size: var(--step-1);
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 999px; padding: 4px 14px;
}
.timer.low { background: #C0392B; border-color: #C0392B; }
.timer small { font-family: var(--font-body); font-weight: 500; font-size: var(--step--1); color: var(--on-band-muted); }
.timer.low small { color: #FFFFFF; }
.answered { font-size: var(--step--1); color: var(--on-band-muted); }
.answered b { color: var(--on-band); }

.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.eyebrow { font-size: var(--step--1); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--heading);
  font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-go { background: var(--go); border-color: var(--go); color: var(--on-go); }
.btn-go:hover { background: var(--go-hover); border-color: var(--go-hover); }
.btn-ghost { background: transparent; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn[aria-disabled="true"] { border-style: dashed; color: var(--muted); background: transparent; cursor: default; }
.btn-band { background: transparent; color: var(--on-band); border-color: rgba(255, 255, 255, .4); min-height: 40px; padding: 6px 14px; }
.btn-band:hover { border-color: #FFFFFF; }

/* intro */
.intro { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.intro-main { padding: 28px; display: grid; gap: 18px; }
.intro-main h1 { font-size: var(--step-4); font-weight: 800; letter-spacing: -.02em; }
.lede { font-size: var(--step-1); color: var(--text); max-width: 60ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 12px; font-size: var(--step--1); font-weight: 600; color: var(--heading); background: var(--surface-2); }
.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fineprint { font-size: var(--step--1); color: var(--muted); }
.scoring { padding: 22px; display: grid; gap: 14px; }
.scoring table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
.scoring th, .scoring td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scoring th { font-size: var(--step--1); color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.scoring td:first-child { font-weight: 700; color: var(--heading); white-space: nowrap; }
.scoring tr:last-child td { border-bottom: 0; }

/* ujian */
.exam { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.qcard { padding: 22px; display: grid; gap: 16px; min-width: 0; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qno { font-family: var(--font-display); font-weight: 800; font-size: var(--step-2); color: var(--heading); }
.qno small { font-family: var(--font-body); font-weight: 500; font-size: var(--step--1); color: var(--muted); margin-left: 6px; }
.tag { font-size: var(--step--1); font-weight: 600; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--heading); border: 1px solid var(--line); }
.stem { font-size: var(--step-1); color: var(--heading); white-space: pre-line; }
.figure { background: var(--figure-bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; }
.figure img { display: block; width: 100%; height: auto; max-width: 100%; margin: 0 auto; }
@media (max-width: 600px) { .figure img { max-width: 360px; } }
.options { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; }
.opt { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; }
.opt:hover { border-color: var(--primary); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .letter { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9375rem; border: 1.5px solid var(--line-strong); color: var(--heading); }
.opt .otext { min-width: 0; padding-top: 2px; }
.opt.is-on { background: var(--sel-bg); border-color: var(--sel-line); }
.opt.is-on .letter { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.qactions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.qactions .grow { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-doubt.is-on { background: var(--doubt-bg); border-color: var(--doubt-line); color: var(--doubt); }

.navcard { padding: 18px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.navgroup { display: grid; gap: 8px; }
.navgroup h3 { font-size: var(--step--1); font-family: var(--font-body); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.grid10 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.nb { min-height: 40px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--heading); font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.nb.ans { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.nb.doubt { background: var(--doubt-bg); border-color: var(--doubt-line); color: var(--doubt); }
.nb.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: var(--step--1); color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line-strong); background: var(--surface); }
.legend i.ans { background: var(--primary); border-color: var(--primary); }
.legend i.doubt { background: var(--doubt-bg); border-color: var(--doubt-line); }

/* konfirmasi */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(5, 19, 42, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); }
.dialog { max-width: 440px; width: 100%; padding: 22px; display: grid; gap: 14px; }
.dialog h2 { font-size: var(--step-2); }
.dialog .cta-row { justify-content: flex-end; }

/* hasil */
.result { display: grid; gap: 20px; }
.score-hero { padding: 26px; display: grid; gap: 18px; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); align-items: center; }
.total { display: grid; gap: 2px; }
.total .big { font-family: var(--font-display); font-weight: 800; font-size: 3.5rem; line-height: 1; color: var(--heading); letter-spacing: -.02em; }
.total .big span { font-size: var(--step-2); color: var(--muted); font-weight: 700; }
.bars { display: grid; gap: 16px; min-width: 0; }
.bar-row { display: grid; gap: 6px; }
.bar-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.bar-top b { color: var(--heading); font-family: var(--font-display); font-size: var(--step-1); }
.bar { position: relative; height: 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--primary); }
.bar .mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--accent); }
.bar-note { font-size: var(--step--1); color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--step--1); font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.mid { background: var(--doubt-bg); color: var(--doubt); }
.section { padding: 22px; display: grid; gap: 14px; }
.section h2 { font-size: var(--step-2); }
.focus-list { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.focus-item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; display: grid; gap: 6px; background: var(--surface-2); }
.focus-item h3 { font-size: var(--step-0); font-family: var(--font-body); font-weight: 700; }
.focus-item .meta { font-size: var(--step--1); color: var(--muted); }
.product { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: center; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 14px; }
.product p { min-width: 0; max-width: 60ch; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters button { min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; font-size: var(--step--1); color: var(--heading); }
.filters button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.review { display: grid; gap: 10px; }
.ritem { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
.ritem summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ritem summary::-webkit-details-marker { display: none; }
.ritem summary .lhs { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.ritem summary .lhs b { font-variant-numeric: tabular-nums; color: var(--heading); }
.ritem summary .lhs span { color: var(--muted); font-size: var(--step--1); }
.rbody { padding: 0 14px 14px; display: grid; gap: 10px; }
.rbody .stem { font-size: var(--step-0); }
.ropts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.ropts li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: .9375rem; }
.ropts li .l { font-weight: 700; color: var(--heading); width: 1.2em; flex: 0 0 auto; }
.ropts li .t { min-width: 0; flex: 1; }
.ropts li .s { font-size: var(--step--1); font-weight: 700; color: var(--muted); white-space: nowrap; }
.ropts li.key { border-color: var(--ok); background: var(--ok-bg); }
.ropts li.mine-bad { border-color: var(--bad); background: var(--bad-bg); }
.ropts li.mine { box-shadow: inset 3px 0 0 var(--primary); }
.explain { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: .9375rem; }
.explain .ref { display: block; margin-top: 6px; font-size: var(--step--1); color: var(--muted); }
.foot { margin-top: 28px; display: grid; gap: 6px; font-size: var(--step--1); color: var(--muted); }

@media (max-width: 900px) {
  .intro, .exam, .score-hero { grid-template-columns: minmax(0, 1fr); }
  .navcard { position: static; }
  .intro-main h1 { font-size: var(--step-3); }
}
@media (max-width: 520px) {
  .intro-main, .qcard, .section, .score-hero { padding: 18px; }
  .brand span { display: none; }
  .qactions .btn { flex: 1 1 auto; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .nb, .btn { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
}

/* simulasi: daftar paket, form kode, gambar bisa digeser, teks soal tidak bisa diblok */
.pklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pk { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--surface-2); }
.pk h3 { font-family: var(--font-display); font-size: var(--step-1); color: var(--heading); }
.kode { display: grid; gap: 8px; }
.kode label { font-weight: 600; color: var(--heading); }
.kode-row { display: flex; gap: 10px; flex-wrap: wrap; }
.kode-row input { flex: 1 1 200px; min-width: 0; font: 600 1.125rem/1.2 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: .06em; padding: 12px 14px; border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--heading); text-transform: uppercase; }
.kode-row input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.figure { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.figure img { pointer-events: none; -webkit-user-drag: none; }
.fig-hint { display: none; }
@media (max-width: 600px) { .figure img { width: 620px; max-width: none; } .fig-hint { display: block; margin-top: -8px; } }
.qcard .stem, .qcard .options, .rbody { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>


<div class="band" id="band">
  <div class="band-inner">
    <div class="brand"><b>overtimeboo</b><span>Simulasi SKD CPNS</span></div>
    <div class="band-stats" id="bandStats" hidden>
      <span class="answered num" id="answered" aria-live="polite"></span>
      <span class="timer num" id="timer" role="timer" aria-label="Sisa waktu"><small>sisa</small><span id="timerText">100:00</span></span>
      <button class="btn btn-band" type="button" id="btnFinishTop">Selesai</button>
    </div>
  </div>
</div>

<main class="wrap" id="app"></main>

<div class="overlay" id="confirm" hidden>
  <div class="dialog card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">Kumpulkan jawaban sekarang?</h2>
    <p id="confirmText"></p>
    <div class="cta-row">
      <button class="btn" type="button" id="btnCancel">Kembali ke soal</button>
      <button class="btn btn-primary" type="button" id="btnSubmit">Kumpulkan</button>
    </div>
  </div>

h membedakan pengamalan tiap sila Pancasila.","bahasa_indonesia":"Latih EYD Edisi V: gabungan kata, kata depan dan awalan di-, huruf kapital, tanda baca, penulisan angka, dan kata baku menurut KBBI.","analogi":"Tentukan dulu relasi pasangan pertama (alat dan fungsi, bagian dan keseluruhan, satuan dan kumpulan, sebab dan akibat), baru cari pasangan dengan relasi yang persis sama.","silogisme":"Gambar diagram Venn untuk premis semua, sebagian, dan tidak ada. Waspadai kesimpulan yang membalik premis atau mengubah sebagian menjadi semua.","analitis":"Buat tabel atau garis posisi. Isi yang sudah pasti lebih dulu, baru uji kemungkinan yang tersisa.","berhitung":"Hafalkan pasangan pecahan, desimal, dan persen yang sering keluar (1/8 = 12,5%, 5/4 = 1,25) supaya hitungan selesai tanpa kalkulator.","deret":"Cek berurutan: selisih, selisih bertingkat, perkalian, lalu pola selang-seling.","perbandingan_kuantitatif":"Hitung nilai x dan y secara terpisah dulu. Jangan menebak dari bentuk soalnya.","soal_cerita":"Ubah cerita jadi persamaan. Sering ada jalan pintas, misalnya menjumlahkan dua persamaan sekaligus.","figural_analogi":"Bandingkan pasangan pertama satu unsur demi satu unsur: bentuk, ukuran, jumlah, posisi, isi atau arsiran.","figural_ketidaksamaan":"Cari satu sifat yang dimiliki empat gambar sekaligus. Gambar yang tidak punya sifat itu jawabannya.","figural_serial":"Lacak tiap elemen secara terpisah. Soal sulit biasanya punya dua gerakan sekaligus, misalnya satu searah jarum jam dan satu berlawanan.","pelayanan_publik":"Skor tertinggi biasanya ada di opsi yang menyelesaikan kebutuhan warga saat itu juga, proaktif, dan tetap sesuai aturan serta wewenang.","jejaring_kerja":"Pilih respons yang membangun kerja sama jangka panjang dan menyelesaikan masalah di sumbernya, bukan sekadar melapor ke atasan.","sosial_budaya":"Hormati keberagaman sambil mencari titik temu. Hindari opsi yang mengucilkan kelompok tertentu atau menyalahkan warga.","tik":"Utamakan keamanan data dan jalu   // ---------- state per paket ----------
  var state = fresh();
  function fresh() { return { phase: "intro", startedAt: 0, endsAt: 0, finishedAt: 0, idx: 0, answers: {}, doubts: {} }; }
  function save() { lsSet(STORE, state); }
  function load(store) { var s = lsGet(store || STORE); return s && s.phase ? s : null; }
  function clearSaved() { lsDel(STORE); }

  // ---------- util ----------
  var app = document.getElementById("app");
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(ms) {
    var t = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(t / 60), s = t % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function dec(x) { return (Math.round(x * 10) / 10).toLocaleString("id-ID", { minimumFractionDigits: 0, maximumFractionDigits: 1 }); }
  function tgl(ms) { return new Date(ms).toLocaleDateString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
  function countAnswered() { return Object.keys(state.answers).length; }
  function countDoubt() { return Object.keys(state.doubts).filter(function (k) { return state.doubts[k]; }).length; }
  function label(sub) { return (REKO.label[sub] || sub); }
  function figure(q, alt) {
    if (!q.gambar || !IMG[q.gambar]) return "";
    return "<div class='figure'><img src='" + IMG[q.gambar] + "' alt='" + esc(alt) + "' draggable='false'></div>" +
      "<p class='fineprint fig-hint'>Gambar bisa digeser ke samping.</p>";
  }
  function bestLetter(q) { return LETTERS.reduce(function (a, b) { return q.skor_opsi[a] >= q.skor_opsi[b] ? a : b; }); }
  function footer() { return "<footer class='foot'><span>" + esc(CONFIG.footer) + "</span></footer>"; }

  // ---------- skor ----------
  function nilai(q, ans) {
    if (!ans) return 0;
    if (q.subtes === "TKP") return q.skor_opsi[ans] || 0;
    return ans === q.kunci ? 5 : 0;
  }
  function hitung() {
    var per = {}, sub = {};
    SUBTES.forEach(function (t) { per[t] = { skor: 0, maks: 0, n: 0 }; });
    Q.forEach(function (q) {
      var v = nilai(q, state.answers[q.id]);
      per[q.subtes].skor += v; per[q.subtes].maks += 5; per[q.subtes].n += 1;
      var k = q.subtopik;
      if (!sub[k]) sub[k] = { subtes: q.subtes, skor: 0, maks: 0, n: 0, benar: 0 };
      sub[k].skor += v; sub[k].maks += 5; sub[k].n += 1;
      if (q.subtes !== "TKP" && v === 5) sub[k].benar += 1;
    });
    SUBTES.forEach(function (t) {
      per[t].ambang = DATA.ambang_penuh[t];
      per[t].lolos = per[t].skor >= per[t].ambang;
    });
    var total = SUBTES.reduce(function (a, t) { return a + per[t].skor; }, 0);
    var maks = SUBTES.reduce(function (a, t) { return a + per[t].maks; }, 0);
    return { per: per, sub: sub, total: total, maks: maks };
  }

  // ---------- 1. masuk: kode akses ----------
  function kodeTersimpan() { return lsGet(KODE_STORE) || []; }
  function renderMasuk(pesan) {
    document.getElementById("bandStats").hidden = true;
    var ids = Object.keys(terbuka).sort();
    var riw = lsGet(RIW_STORE) || {};
    var daftar = ids.map(function (id) {
      var d = terbuka[id];
      var s = load("ovt-sim-cpns-paket" + id + "-v1");
      var r = (riw[id] || [])[0];
      var status = r ? "Terakhir " + tgl(r.t) + ": <b class='num'>" + r.total + "</b>/550 · " + (r.lolos ? "lolos ambang" : "belum lolos ambang") + (riw[id].length > 1 ? " · " + riw[id].length + " percobaan" : "")
                     : "Belum pernah dikerjakan";
      var aksi;
      if (s && s.phase === "test" && Date.now() < s.endsAt) aksi = "Lanjutkan (" + fmt(s.endsAt - Date.now()) + " lagi)";
      else if (s && s.phase === "test") aksi = "Lihat hasil";
      else if (s && s.phase === "result") aksi = "Lihat hasil terakhir";
      else aksi = "Kerjakan";
      return "<li class='pk'><div><h3>" + esc(d.nama) + "</h3><p class='fineprint'>" + status + "</p></div>" +
        "<button class='btn btn-go' type='button' data-p='" + id + "'>" + aksi + "</button></li>";
    }).join("");
    app.innerHTML =
      "<section class='intro'>" +
        "<div class='card intro-main'>" +
          "<p class='eyebrow'>Khusus pembeli · Format CAT BKN</p>" +
          "<h1>Simulasi SKD CPNS</h1>" +
          "<p class='lede'>110 soal dalam 100 menit, satu soal per layar. Skor TWK, TIU, dan TKP keluar begitu kamu kumpulkan, lengkap dengan pembahasan dan materi yang perlu dilatih.</p>" +
          (daftar ? "<ul class='pklist'>" + daftar + "</ul>" : "") +
          "<form class='kode' id='fKode' autocomplete='off'>" +
            "<label for='iKode'>" + (ids.length ? "Punya kode paket lain?" : "Masukkan kode akses") + "</label>" +
            "<div class='kode-row'><input id='iKode' name='kode' inputmode='text' autocapitalize='characters' spellcheck='false' placeholder='SKD1-XXXX-XXXX' maxlength='20' required>" +
            "<button class='btn btn-primary' type='submit' id='btnKode'>Buka paket</button></div>" +
            "<p class='fineprint' id='kodeMsg' role='status'>" + (pesan ? esc(pesan) : "Kode ada di halaman 2 PDF yang kamu beli. Beli bundle? Masukkan ketiga kodenya satu per satu.") + "</p>" +
          "</form>" +
          "<p class='fineprint'>" + esc(CONFIG.disclaimer) + "</p>" +
        "</div>" +
        "<aside class='card scoring'>" +
          "<p class='eyebrow'>Belum punya kode?</p>" +
          "<p>Kode akses ikut di tiap PDF Tryout SKD CPNS. Satu kode membuka satu paket.</p>" +
          "<div class='cta-row'><a class='btn' href='" + esc(CONFIG.toko) + "' target='_blank' rel='noopener'>Lihat paketnya di lynk.id</a>" +
          "<a class='btn' href='" + esc(CONFIG.tryoutMini) + "'>Coba tryout mini gratis</a></div>" +
          "<p class='fineprint'>" + esc(CONFIG.catatanAmbang) + "</p>" +
        "</aside>" +
      "</section>" + footer();
    Array.prototype.forEach.call(app.querySelectorAll(".pk button"), function (b) {
      b.onclick = function () { masukPaket(b.getAttribute("data-p")); };
    });
    document.getElementById("fKode").onsubmit = function (e) {
      e.preventDefault();
      var kode = normKode(document.getElementById("iKode").value);
      var msg = document.getElementById("kodeMsg");
      if (!kode) { msg.textContent = "Format kode 12 karakter, contoh SKD1-AB2C-D3EF."; return; }
      var btn = document.getElementById("btnKode");
      btn.disabled = true; msg.textContent = "Membuka paket...";
      buka(kode).then(function (r) {
        terbuka[r.id] = r.data;
        var ks = kodeTersimpan(); if (ks.indexOf(kode) < 0) { ks.push(kode); lsSet(KODE_STORE, ks); }
        renderMasuk(r.data.nama + " terbuka.");
      }, function () {
        btn.disabled = false;
        msg.textContent = "Kode tidak cocok. Cek lagi di halaman 2 PDF kamu, huruf O, I, L dan angka 0, 1 tidak dipakai.";
      });
    };
  }

  // ---------- 2. pilih paket -> petunjuk ----------
  function masukPaket(id) {
    setPaket(id);
    var saved = load();
    if (saved && saved.phase === "test") {
      if (Date.now() >= saved.endsAt) { state = saved; finish(true); }
      else renderIntro(saved);
    } else if (saved && saved.phase === "result") {
      state = saved; renderResult();
    } else { state = fresh(); renderIntro(null); }
    window.scrollTo({ top: 0 });
  }
  function renderIntro(resumable) {
    document.getElementById("bandStats").hidden = true;
    var rows = SUBTES.map(function (t) {
      var n = DATA[t.toLowerCase()].length;
      var aturan = t === "TKP" ? "Tiap opsi bernilai 1 sampai 5. Tidak ada jawaban salah, yang ada paling tepat." : "Benar 5, salah atau kosong 0.";
      return "<tr><td>" + t + "</td><td class='num'>" + n + " soal</td><td>" + esc(REKO.isi[t]) + "<br><span class='fineprint'>" + esc(aturan) + " Ambang " + DATA.ambang_penuh[t] + ".</span></td></tr>";
    }).join("");
    app.innerHTML =
      "<section class='intro'>" +
        "<div class='card intro-main'>" +
          "<p class='eyebrow'>Simulasi CAT · " + esc(DATA.nama) + "</p>" +
          "<h1>Sebelum mulai</h1>" +
          "<div class='facts'><span class='fact num'>" + N + " soal</span><span class='fact num'>" + DATA.durasi_menit + " menit</span><span class='fact'>TWK · TIU · TKP</span></div>" +
          "<ul class='rules'>" +
            "<li>Timer jalan begitu kamu mulai dan tetap jalan walau halaman ditutup. Kalau waktu habis, jawabanmu otomatis dikumpulkan.</li>" +
            "<li>Soal boleh dilompati. Tandai <b>ragu-ragu</b> kalau mau balik lagi nanti.</li>" +
            "<li>Kunci dan pembahasan baru terbuka setelah jawaban dikumpulkan.</li>" +
            "<li>Nggak ada nilai minus, jadi jangan ada yang dikosongin.</li>" +
            "<li>Jawaban cuma tersimpan di perangkat ini. Pindah perangkat berarti mulai dari awal.</li>" +
          "</ul>" +
          "<div class='cta-row'>" +
            (resumable ? "<button class='btn btn-go' type='button' id='btnResume'>Lanjutkan (" + fmt(resumable.endsAt - Date.now()) + " lagi)</button><button class='btn' type='button' id='btnRestart'>Mulai dari awal</button>"
                       : "<button class='btn btn-go' type='button' id='btnStart'>Mulai simulasi</button>") +
            "<button class='btn' type='button' id='btnHome'>Pilih paket lain</button>" +
          "</div>" +
        "</div>" +
        "<aside class='card scoring' aria-label='Susunan soal dan cara penilaian'>" +
          "<p class='eyebrow'>Susunan soal</p>" +
          "<div style='overflow-x:auto'><table><thead><tr><th>Subtes</th><th>Jumlah</th><th>Isi dan penilaian</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
          "<p class='fineprint'>" + esc(CONFIG.catatanAmbang) + "</p>" +
        "</aside>" +
      "</section>" + footer();
    var b = document.getElementById("btnStart"); if (b) b.onclick = start;
    var r = document.getElementById("btnResume"); if (r) r.onclick = function () { state = resumable; renderExam(); };
    var x = document.getElementById("btnRestart"); if (x) x.onclick = function () { clearSaved(); state = fresh(); start(); };
    document.getElementById("btnHome").onclick = function () { renderMasuk(); };
  }

  // ---------- 3. ujian ----------
  var tick = null;
  function start() {
    state = fresh();
    state.phase = "test";
    state.startedAt = Date.now();
    state.endsAt = state.startedAt + DURASI_MS;
    save();
    renderExam();
  }
  function renderExam() {
    document.getElementById("bandStats").hidden = false;
    var q = Q[state.idx];
    var ans = state.answers[q.id];
    var opts = LETTERS.map(function (L) {
      var on = ans === L;
      return "<label class='opt" + (on ? " is-on" : "") + "' for='o" + L + "'>" +
        "<input type='radio' name='opsi' id='o" + L + "' value='" + L + "'" + (on ? " checked" : "") + ">" +
        "<span class='letter' aria-hidden='true'>" + L + "</span>" +
        "<span class='otext'>" + esc(q.opsi[L]) + "</span></label>";
    }).join("");
    var fig = figure(q, "Gambar soal figural nomor " + (state.idx + 1) + ". Pilihan jawaban berlabel A sampai E ada di gambar.");
    var doubt = !!state.doubts[q.id];
    app.innerHTML =
      "<section class='exam'>" +
        "<article class='card qcard' aria-labelledby='qno'>" +
          "<div class='qhead'><h2 class='qno num' id='qno'>Soal " + (state.idx + 1) + "<small>dari " + N + "</small></h2>" +
          "<span class='tag'>" + q.subtes + "</span></div>" +
          "<p class='stem'>" + esc(q.soal) + "</p>" + fig +
          "<fieldset class='options'><legend class='eyebrow' style='margin-bottom:4px'>Pilih satu jawaban</legend>" + opts + "</fieldset>" +
          "<div class='qactions'>" +
            "<button class='btn' type='button' id='btnPrev'" + (state.idx === 0 ? " disabled" : "") + ">Sebelumnya</button>" +
            "<div class='grow'>" +
              "<button class='btn btn-doubt" + (doubt ? " is-on" : "") + "' type='button' id='btnDoubt' aria-pressed='" + doubt + "'>" + (doubt ? "Ditandai ragu-ragu" : "Ragu-ragu") + "</button>" +
              (state.idx < N - 1 ? "<button class='btn btn-primary' type='button' id='btnNext'>Berikutnya</button>"
                                 : "<button class='btn btn-go' type='button' id='btnEnd'>Selesai</button>") +
            "</div>" +
          "</div>" +
        "</article>" +
        "<aside class='card navcard' aria-label='Daftar nomor soal'>" + navGrid() +
          "<div class='legend'><span><i class='ans'></i>Terjawab</span><span><i class='doubt'></i>Ragu-ragu</span><span><i></i>Belum</span></div>" +
          "<button class='btn btn-go' type='button' id='btnEndSide'>Selesai dan lihat skor</button>" +
        "</aside>" +
      "</section>";
    Array.prototype.forEach.call(app.querySelectorAll("input[name=opsi]"), function (inp) {
      inp.addEventListener("change", function () { pick(inp.value); });
    });
    document.getElementById("btnPrev").onclick = function () { go(state.idx - 1); };
    var nx = document.getElementById("btnNext"); if (nx) nx.onclick = function () { go(state.idx + 1); };
    var en = document.getElementById("btnEnd"); if (en) en.onclick = askFinish;
    document.getElementById("btnEndSide").onclick = askFinish;
    document.getElementById("btnDoubt").onclick = function () {
      state.doubts[q.id] = !state.doubts[q.id];
      if (!state.doubts[q.id]) delete state.doubts[q.id];
      save(); renderExam();
    };
    Array.prototype.forEach.call(app.querySelectorAll(".nb"), function (b) {
      b.onclick = function () { go(parseInt(b.getAttribute("data-i"), 10)); };
    });
    updateBand();
    if (!tick) tick = setInterval(updateBand, 500);
  }
  function navGrid() {
    return SUBTES.map(function (t) {
      var cells = Q.map(function (q, i) { return { q: q, i: i }; }).filter(function (x) { return x.q.subtes === t; }).map(function (x) {
        var cls = "nb";
        if (state.doubts[x.q.id]) cls += " doubt"; else if (state.answers[x.q.id]) cls += " ans";
        if (x.i === state.idx) cls += " cur";
        var st = state.doubts[x.q.id] ? "ragu-ragu" : (state.answers[x.q.id] ? "terjawab" : "belum dijawab");
        return "<button class='" + cls + "' type='button' data-i='" + x.i + "' aria-label='Soal " + (x.i + 1) + ", " + st + "'" + (x.i === state.idx ? " aria-current='step'" : "") + ">" + (x.i + 1) + "</button>";
      }).join("");
      return "<div class='navgroup'><h3>" + t + "</h3><div class='grid10'>" + cells + "</div></div>";
    }).join("");
  }
  function pick(L) {
    var q = Q[state.idx];
    state.answers[q.id] = L;
    save();
    renderExam();
    var el = document.getElementById("o" + L);
    if (el) el.focus({ preventScroll: true });
  }
  function go(i) {
    if (i < 0 || i >= N) return;
    state.idx = i; save(); renderExam();
    var top = document.getElementById("qno");
    if (top && top.getBoundingClientRect().top < 70) window.scrollTo({ top: 0 });
  }
  function updateBand() {
    if (state.phase !== "test") return;
    var left = state.endsAt - Date.now();
    var t = document.getElementById("timer");
    document.getElementById("timerText").textContent = fmt(left);
    t.classList.toggle("low", left <= 5 * 60 * 1000);
    document.getElementById("answered").innerHTML = "<b>" + countAnswered() + "</b>/" + N + " terjawab";
    if (left <= 0) finish(true);
  }
  function askFinish() {
    var kosong = N - countAnswered(), ragu = countDoubt();
    var parts = [];
    if (kosong) parts.push(kosong + " soal masih kosong");
    if (ragu) parts.push(ragu + " soal ditandai ragu-ragu");
    document.getElementById("confirmText").textContent = parts.length
      ? "Ada " + parts.join(" dan ") + ". Soal kosong bernilai 0, jadi sebaiknya tetap diisi."
      : "Semua soal sudah terjawab. Setelah dikumpulkan, jawaban tidak bisa diubah.";
    document.getElementById("confirm").hidden = false;
    document.getElementById("btnSubmit").focus();
  }
  document.getElementById("btnCancel").onclick = function () { document.getElementById("confirm").hidden = true; };
  document.getElementById("btnSubmit").onclick = function () { document.getElementById("confirm").hidden = true; finish(false); };
  document.getElementById("btnFinishTop").onclick = askFinish;
  document.addEventListener("keydown", function (e) {
    if (state.phase !== "test" || !DATA || !document.getElementById("confirm").hidden) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toUpperCase();
    if (LETTERS.indexOf(k) >= 0) { pick(k); }
    if (e.key === "Escape") document.getElementById("confirm").hidden = true;
  });

  function finish(auto) {
    if (state.phase !== "test") return;
    state.phase = "result";
    state.finishedAt = Math.min(Date.now(), state.endsAt);
    state.auto = !!auto;
    save();
    clearInterval(tick); tick = null;
    var h = hitung();
    var riw = lsGet(RIW_STORE) || {};
    riw[PAKET] = [{ t: state.finishedAt, total: h.total, lolos: SUBTES.every(function (t) { return h.per[t].lolos; }) }].concat(riw[PAKET] || []).slice(0, 10);
    lsSet(RIW_STORE, riw);
    renderResult();
    window.scrollTo({ top: 0 });
  }

  // ---------- 4. hasil ----------
  var filter = "semua";
  function renderResult() {
    document.getElementById("bandStats").hidden = true;
    var h = hitung();
    var bars = SUBTES.map(function (t) {
      var p = h.per[t];
      var pct = p.skor / p.maks * 100, mark = p.ambang / p.maks * 100;
      return "<div class='bar-row'>" +
        "<div class='bar-top'><span><b>" + t + "</b> <span class='num'>" + p.skor + "/" + p.maks + "</span></span>" +
        "<span class='chip " + (p.lolos ? "ok'>Memenuhi ambang" : "bad'>Di bawah ambang") + "</span></div>" +
        "<div class='bar' role='img' aria-label='" + t + " skor " + p.skor + " dari " + p.maks + ", ambang " + p.ambang + "'>" +
          "<span class='fill' style='width:" + pct.toFixed(1) + "%'></span><span class='mark' style='left:calc(" + mark.toFixed(1) + "% - 1px)'></span></div>" +
        "<p class='bar-note num'>Ambang " + p.ambang + " · " + (p.lolos ? "lebih " + (p.skor - p.ambang) : "kurang " + (p.ambang - p.skor)) + " poin</p>" +
      "</div>";
    }).join("");
    var lolosSemua = SUBTES.every(function (t) { return h.per[t].lolos; });
    var durasi = state.finishedAt - state.startedAt;
    var fokus = pilihFokus(h.sub);
    var fokusHtml = fokus.length ? fokus.map(function (k) {
      var s = h.sub[k];
      var meta = s.subtes === "TKP" ? ("rata-rata skor " + dec(s.skor / s.n) + " dari 5 di " + s.n + " soal") : (s.benar + " dari " + s.n + " soal benar");
      return "<div class='focus-item'><h3>" + esc(label(k)) + " <span class='tag'>" + s.subtes + "</span></h3>" +
        "<p class='meta num'>" + meta + "</p><p>" + esc(REKO.materi[k] || "") + "</p></div>";
    }).join("") : "<p>Semua subtopik di atas 80 persen. Coba paket lain untuk memastikan hasilnya konsisten.</p>";
    app.innerHTML =
      "<section class='result'>" +
        "<div class='card score-hero'>" +
          "<div class='total'><p class='eyebrow'>" + esc(DATA.nama) + " · skor total</p><p class='big num'>" + h.total + "<span>/" + h.maks + "</span></p>" +
          "<p class='fineprint num'>" + (state.auto ? "Waktu habis, jawaban dikumpulkan otomatis. " : "") + "Selesai dalam " + fmt(durasi) + " · " + countAnswered() + " dari " + N + " soal terjawab</p>" +
          "<p>" + (lolosSemua ? "Ketiga subtes di atas ambang. Di SKD asli, yang lanjut ke SKB adalah peringkat teratas per formasi, jadi kejar skor setinggi mungkin, bukan sekadar lolos." : "Ada subtes yang masih di bawah ambang. Di SKD, satu subtes gagal sudah cukup untuk tidak lolos.") + "</p></div>" +
          "<div class='bars'>" + bars + "<p class='fineprint'>" + esc(CONFIG.catatanAmbang) + "</p></div>" +
        "</div>" +
        "<div class='card section'><h2>Yang perlu kamu latih dulu</h2>" +
          "<p class='fineprint'>Tiga subtopik dengan persentase terendah di paket ini, yang masih di bawah 80 persen.</p>" +
          "<div class='focus-list'>" + fokusHtml + "</div>" +
        "</div>" +
        "<div class='card section'><h2>Pembahasan tiap nomor</h2>" +
          "<div class='filters' role='group' aria-label='Saring pembahasan'>" +
            fbtn("semua", "Semua (" + N + ")") + fbtn("salah", "Salah atau kosong") + fbtn("tkp", "TKP di bawah skor 5") +
          "</div><div class='review' id='review'></div>" +
          "<div class='cta-row'><button class='btn' type='button' id='btnAgain'>Ulangi paket ini</button><button class='btn btn-primary' type='button' id='btnHome2'>Pilih paket lain</button></div>" +
        "</div>" +
      "</section>" + footer();
    renderReview();
    Array.prototype.forEach.call(app.querySelectorAll(".filters button"), function (b) {
      b.onclick = function () { filter = b.getAttribute("data-f"); renderResultFilters(); renderReview(); };
    });
    document.getElementById("btnAgain").onclick = function () { clearSaved(); state = fresh(); filter = "semua"; renderIntro(null); window.scrollTo({ top: 0 }); };
    document.getElementById("btnHome2").onclick = function () { filter = "semua"; renderMasuk(); window.scrollTo({ top: 0 }); };
  }
  function fbtn(f, text) { return "<button type='button' data-f='" + f + "' aria-pressed='" + (filter === f) + "'>" + esc(text) + "</button>"; }
  function renderResultFilters() {
    Array.prototype.forEach.call(app.querySelectorAll(".filters button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-f") === filter)); });
  }
  function pilihFokus(sub) {
    var arr = Object.keys(sub).map(function (k) { return { k: k, r: sub[k].skor / sub[k].maks }; });
    arr.sort(function (a, b) { return a.r - b.r; });
    return arr.filter(function (x) { return x.r < 0.8; }).slice(0, 3).map(function (x) { return x.k; });
  }
  function renderReview() {
    var box = document.getElementById("review");
    var html = Q.map(function (q, i) {
      var a = state.answers[q.id];
      var v = nilai(q, a);
      if (filter === "salah" && (q.subtes === "TKP" || v === 5)) return "";
      if (filter === "tkp" && (q.subtes !== "TKP" || v === 5)) return "";
      var status;
      if (q.subtes === "TKP") status = a ? "<span class='chip " + (v === 5 ? "ok" : (v >= 3 ? "mid" : "bad")) + " num'>Skor " + v + "</span>" : "<span class='chip bad'>Kosong</span>";
      else status = a ? (v === 5 ? "<span class='chip ok'>Benar</span>" : "<span class='chip bad'>Salah</span>") : "<span class='chip bad'>Kosong</span>";
      var best = q.subtes === "TKP" ? bestLetter(q) : q.kunci;
      var opts = LETTERS.map(function (L) {
        var cls = [];
        if (L === best) cls.push("key");
        if (L === a) cls.push(L === best ? "mine" : "mine-bad mine");
        var right = q.subtes === "TKP" ? "<span class='s num'>skor " + q.skor_opsi[L] + "</span>" : (L === q.kunci ? "<span class='s'>kunci</span>" : "");
        if (L === a) right = "<span class='s'>jawabanmu</span>" + (q.subtes === "TKP" ? " <span class='s num'>· skor " + q.skor_opsi[L] + "</span>" : "");
        return "<li class='" + cls.join(" ") + "'><span class='l'>" + L + "</span><span class='t'>" + esc(q.opsi[L]) + "</span>" + right + "</li>";
      }).join("");
      var fig = figure(q, "Gambar soal figural nomor " + (i + 1));
      var ref = q.referensi ? "<span class='ref'>Rujukan: " + esc(q.referensi) + "</span>" : "";
      return "<details class='ritem'><summary><span class='lhs'><b>" + (i + 1) + "</b><span>" + q.subtes + " · " + esc(label(q.subtopik)) + "</span></span>" + status + "</summary>" +
        "<div class='rbody'><p class='stem'>" + esc(q.soal) + "</p>" + fig + "<ul class='ropts'>" + opts + "</ul>" +
        "<p class='explain'>" + esc(q.pembahasan) + ref + "</p></div></details>";
    }).join("");
    box.innerHTML = html || "<p class='fineprint'>Tidak ada soal di saringan ini. Mantap.</p>";
  }

  // ---------- boot: buka ulang kode yang tersimpan ----------
  if (!window.crypto || !crypto.subtle) {
    app.innerHTML = "<section class='card intro-main'><h1>Browser belum didukung</h1><p>Buka halaman ini lewat Chrome, Safari, atau Firefox versi terbaru.</p></section>";
    return;
  }
  app.innerHTML = "<section class='card intro-main'><p>Menyiapkan simulasi...</p></section>";
  var ks = kodeTersimpan();
  var masihBerlaku = [];
  Promise.all(ks.map(function (k) { return buka(k).then(function (r) { terbuka[r.id] = r.data; masihBerlaku.push(k); }, function () { /* kode lama sudah diganti */ }); }))
    .then(function () { if (masihBerlaku.length !== ks.length) lsSet(KODE_STORE, masihBerlaku); renderMasuk(); });
})();
</script>
